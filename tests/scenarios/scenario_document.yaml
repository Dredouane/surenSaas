test_case: "Envoi de document facture pour traitement OCR"
description: >
  L'utilisateur envoie un fichier PDF (facture) au bot. Le bot doit
  accuser réception du document, lancer le workflow OCR/extraction, et
  proposer une action (validation, modification, annulation).
tags: [document, facture, ocr, upload]
input:
  chat_id: 999999
  from_user:
    id: 999999
    first_name: "Test"
    is_bot: false
  media:
    type: document
    file_path: "tests/fixtures/media/facture_test.pdf"
    caption: "Facture fournisseur béton"
judge:
  model: gemini-2.0-flash
  prompt: |
    Vérifie que la réponse du bot :
    1. Accuse réception du document (PDF/fichier reçu)
    2. Mentionne le lancement de l'analyse OCR ou extraction
    3. Propose une action à l'utilisateur (valider, modifier, annuler)
    4. Affiche ou mentionne des données extraites (fournisseur, montant, etc.)

    Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
  expected_verdict: pass
