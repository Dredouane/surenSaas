test_case: "DOCUMENT-001"
description: "L'utilisateur envoie un fichier PDF (facture) au bot. Le bot doit accuser réception du document, lancer le workflow OCR/extraction, et proposer une action (validation, modification, annulation)."
steps:
  - type: document
    content: "tests/fixtures/media/facture_test.pdf"
    judge_prompt: |
      Vérifie que la réponse du bot :
      1. Accuse réception du document (PDF/fichier reçu)
      2. Mentionne le lancement de l'analyse OCR ou extraction
      3. Propose une action à l'utilisateur (valider, modifier, annuler)
      4. Affiche ou mentionne des données extraites (fournisseur, montant, etc.)
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
