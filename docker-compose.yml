version: '3.8'

services:
  backend:
    build:
      context: ./surenSaasBack
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=http://localhost:3000
      - DEBUG=true
      - PORT=8080
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - surensaas-network

  frontend:
    build:
      context: ./surenSaasFront
      dockerfile: Dockerfile
      args:
        - BUILD_ID=local-dev
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8080
      - BUILD_ID=local-dev
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - surensaas-network

networks:
  surensaas-network:
    driver: bridge
