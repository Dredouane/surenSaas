test_case: "DOCUMENT-OCR-001"
description: "L'utilisateur envoie une facture PDF (ACORUS, INV-EXA-0001, 3280.78€ HT). Le bot doit extraire les données et proposer validation/modification."
steps:
  - type: document
    content: "e2e-harness/data/INV-EXA-0001_EXAMPLE-SOCIETE.pdf"
    judge_prompt: |
      Vérifie que la réponse du bot :
      1. Accuse réception du document (fichier reçu)
      2. Mentionne le fournisseur "ACORUS"
      3. Mentionne le numéro de facture "INV-EXA-0001"
      4. Mentionne le montant  autour de 3280.78€
      5. Propose une action à l'utilisateur ou invite à donner une suite (valider, modifier, annuler, ou question ouverte)
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
