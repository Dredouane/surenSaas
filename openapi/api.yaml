# SurenSaaS API Contract
openapi: 3.0.3
info:
  title: SurenSaaS API
  version: 1.0.0
  description: API multi-PME pour construction, nettoyage et diagnostic énergétique

servers:
  - url: https://back-xxx.run.app/api/v1
    description: Production

paths:
  /{org}/health:
    get:
      summary: Health check
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /{org}/users/me:
    get:
      summary: Profil utilisateur connecté
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ============================================
  # AUTHENTICATION
  # ============================================

  /auth/session:
    get:
      summary: Vérifier la session utilisateur
      description: Retourne les informations de session si le cookie est valide
      responses:
        200:
          description: Session valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        401:
          description: Session invalide

  /auth/check-email:
    post:
      summary: Vérifier si un email est pré-autorisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCheckRequest'
      responses:
        200:
          description: Résultat de la vérification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCheckResponse'

  /auth/signup:
    post:
      summary: Créer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        200:
          description: Compte créé avec succès
        400:
          description: Données invalides
        403:
          description: Email non autorisé

  /auth/login:
    post:
      summary: Connecter un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Connexion réussie
        401:
          description: Identifiants invalides

  /auth/logout:
    post:
      summary: Déconnecter l'utilisateur
      responses:
        200:
          description: Déconnexion réussie

  # ============================================
  # USERS
  # ============================================

  /users/me:
    get:
      summary: Profil utilisateur connecté
      responses:
        200:
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        401:
          description: Non authentifié

  # ============================================
  # CLIENTS
  # ============================================

  /clients:
    get:
      summary: Lister les clients
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Liste des clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        401:
          description: Non authentifié
        403:
          description: Accès non autorisé

    post:
      summary: Créer un client
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        201:
          description: Client créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        401:
          description: Non authentifié

  /clients/{client_id}:
    get:
      summary: Détails d'un client
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails du client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        404:
          description: Client non trouvé

    put:
      summary: Modifier un client
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        200:
          description: Client modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'

    delete:
      summary: Supprimer un client
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Client supprimé
        403:
          description: Non autorisé

  # ============================================
  # INVOICES (NOUVELLE VERSION)
  # ============================================

  /invoices:
    get:
      summary: Lister les factures
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [brouillon, en_attente_validation, validee, rejetee, en_traitement_comptable, archivee]
        - name: client_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Liste des factures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'

    post:
      summary: Créer une facture
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        201:
          description: Facture créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceV2'

  /invoices/{invoice_id}:
    get:
      summary: Détails d'une facture
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails de la facture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceV2'
        404:
          description: Facture non trouvée

    put:
      summary: Modifier une facture (brouillon uniquement)
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        200:
          description: Facture modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceV2'
        400:
          description: Facture non modifiable (pas en brouillon)

    delete:
      summary: Supprimer une facture (brouillon uniquement)
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Facture supprimée
        400:
          description: Facture non supprimable (pas en brouillon)

  /invoices/{invoice_id}/validate:
    post:
      summary: Valider ou rejeter une facture
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [validate, reject]
      responses:
        200:
          description: Facture mise à jour
        400:
          description: Action invalide ou facture non en attente

  # ============================================
  # TELEGRAM BOT
  # ============================================

  /{org}/telegram/webhook/{bot_token}:
    post:
      summary: Webhook Telegram (public)
      description: Reçoit les updates du bot Telegram. Ne nécessite pas d'authentification car vérifié par secret.
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: bot_token
          in: path
          required: true
          schema:
            type: string
          description: Hash partiel du token pour identifier le bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Update Telegram standard
      responses:
        200:
          description: OK
        401:
          description: Secret invalide
        404:
          description: Bot non trouvé

  /{org}/telegram/bots:
    get:
      summary: Lister les bots Telegram
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: Liste des bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelegramBot'

    post:
      summary: Créer un bot Telegram
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        201:
          description: Bot créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBot'
        403:
          description: Non autorisé (capability admin requise)

  /{org}/telegram/bots/{bot_id}:
    get:
      summary: Détails et status d'un bot
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails du bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBotStatus'

    delete:
      summary: Désactiver un bot
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Bot désactivé
        403:
          description: Non autorisé

  # ============================================
  # COMPANIES (ENTREPRISES FILIALES)
  # ============================================

  /{org}/companies:
    get:
      summary: Lister les entreprises filiales
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Liste des entreprises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'

  /{org}/companies/{company_id}/capabilities:
    get:
      summary: Lister mes capabilities pour cette entreprise
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Liste des capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ============================================
  # INVOICES (FACTURES CHANTIERS)
  # ============================================

  /{org}/companies/{company_id}/invoices:
    get:
      summary: Lister les factures
      security:
        - bearerAuth: []
      description: Nécessite capability construction:facturation:read ou rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [brouillon, en_attente_validation, validee, rejetee, en_traitement_comptable, archivee]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Liste des factures
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  total:
                    type: integer
        403:
          description: Capability manquante

    post:
      summary: Créer une facture (manuel ou bot)
      security:
        - bearerAuth: []
      description: Nécessite capability construction:facturation:write ou rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        201:
          description: Facture créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        403:
          description: Capability manquante

  /{org}/companies/{company_id}/invoices/{invoice_id}:
    get:
      summary: Détails d'une facture
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails de la facture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        404:
          description: Facture non trouvée

    put:
      summary: Modifier une facture
      security:
        - bearerAuth: []
      description: Nécessite capability construction:facturation:write ou rôle admin. Ne fonctionne que sur les factures en brouillon.
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
      responses:
        200:
          description: Facture modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        403:
          description: Non autorisé ou facture non modifiable

    delete:
      summary: Supprimer une facture
      security:
        - bearerAuth: []
      description: Nécessite rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Facture supprimée
        403:
          description: Non autorisé

  /{org}/companies/{company_id}/invoices/{invoice_id}/validate:
    post:
      summary: Valider ou rejeter une facture
      security:
        - bearerAuth: []
      description: Nécessite capability construction:facturation:validate ou rôle admin
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateInvoiceRequest'
      responses:
        200:
          description: Facture mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        403:
          description: Capability manquante

  /{org}/companies/{company_id}/invoices/{invoice_id}/history:
    get:
      summary: Historique des status d'une facture
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Historique
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceStatusHistory'

  # ============================================
  # TELEGRAM AUDIT (ADMIN)
  # ============================================

  /{org}/telegram/audit:
    get:
      summary: Logs d'audit Telegram (admin uniquement)
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: bot_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Logs d'audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelegramAuditLog'
                  total:
                    type: integer
        403:
          description: Admin requis

  # ============================================
  # ADMIN - TELEGRAM BOTS
  # ============================================

  /admin/telegram/bots:
    get:
      summary: Lister les bots Telegram disponibles
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin. Retourne tous les bots configurés pour l'environnement actuel.
      responses:
        200:
          description: Liste des bots disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  bots:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelegramBotInfo'
                  environment:
                    type: string
                    enum: [test, prod]
        403:
          description: Admin requis

  /admin/users/{user_id}/telegram-invitation:
    post:
      summary: Générer un lien d'invitation Telegram
      security:
        - bearerAuth: []
      description: |
        Génère un lien d'invitation pour un utilisateur vers un bot Telegram spécifique.
        Le lien expire après 7 jours par défaut.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramInvitationRequest'
      responses:
        200:
          description: Lien d'invitation généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramInvitationResponse'
        400:
          description: Paramètres invalides ou bot non configuré
        403:
          description: Admin requis
        404:
          description: Utilisateur non trouvé

  # ============================================
  # TELEGRAM WEBHOOK (PUBLIC)
  # ============================================

  /webhook/construction:
    post:
      summary: Webhook Telegram Construction Bot
      description: |
        Reçoit les updates du bot Telegram Construction. 
        Cette route est publique mais vérifie le secret token si configuré.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Update Telegram standard
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: false
          schema:
            type: string
          description: Secret token pour vérification (optionnel)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object

  /webhook/construction/health:
    get:
      summary: Health check webhook construction
      responses:
        200:
          description: Statut du webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  environment:
                    type: string
                  bot_username:
                    type: string
                    nullable: true
                  configured:
                    type: boolean

  # ============================================
  # ADMIN - PRE-AUTHORIZED EMAILS
  # ============================================

  /admin/pre-authorized-emails:
    get:
      summary: Lister les emails pré-autorisés
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      responses:
        200:
          description: Liste des emails pré-autorisés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreAuthorizedEmail'
        403:
          description: Admin requis

    post:
      summary: Ajouter un email pré-autorisé
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthorizedEmailCreate'
      responses:
        201:
          description: Email pré-autorisé créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreAuthorizedEmail'
        400:
          description: Données invalides
        403:
          description: Admin requis
        409:
          description: Email déjà pré-autorisé

  /admin/pre-authorized-emails/{email_id}:
    patch:
      summary: Modifier un email pré-autorisé
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreAuthorizedEmailUpdate'
      responses:
        200:
          description: Email pré-autorisé mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreAuthorizedEmail'
        403:
          description: Admin requis
        404:
          description: Email pré-autorisé non trouvé

    delete:
      summary: Supprimer un email pré-autorisé
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Email pré-autorisé supprimé
        403:
          description: Admin requis
        404:
          description: Email pré-autorisé non trouvé

  # ============================================
  # ADMIN - USER CAPABILITIES
  # ============================================

  /admin/users/{user_id}/capabilities:
    get:
      summary: Lister les capabilities d'un utilisateur
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Liste des capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCapability'
        403:
          description: Admin requis

    post:
      summary: Assigner une capability à un utilisateur
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCapabilityCreate'
      responses:
        201:
          description: Capability assignée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCapability'
        400:
          description: Données invalides
        403:
          description: Admin requis
        404:
          description: Utilisateur non trouvé

  /admin/users/{user_id}/capabilities/{capability_id}:
    put:
      summary: Modifier une capability d'un utilisateur
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCapabilityUpdate'
      responses:
        200:
          description: Capability mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCapability'
        403:
          description: Admin requis
        404:
          description: Capability non trouvée

    delete:
      summary: Retirer une capability d'un utilisateur
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Capability retirée
        403:
          description: Admin requis
        404:
          description: Capability non trouvée

  # ============================================
  # ADMIN - ORGANIZATION CAPABILITIES
  # ============================================

  /admin/organization-capabilities:
    get:
      summary: Lister les capabilities de l'organisation
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      responses:
        200:
          description: Liste des capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationCapability'
        403:
          description: Admin requis

    post:
      summary: Créer une capability pour l'organisation
      security:
        - bearerAuth: []
      description: Nécessite le rôle admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCapabilityCreate'
      responses:
        201:
          description: Capability créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCapability'
        400:
          description: Données invalides
        403:
          description: Admin requis
        409:
          description: Capability existe déjà

  # ============================================
  # EMAILS - MODULE D'INGESTION GMAIL
  # ============================================

  /{org}/emails/accounts:
    get:
      summary: Lister les comptes Gmail configurés
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Liste des comptes email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailAccount'
        403:
          description: Non autorisé

    post:
      summary: Connecter un compte Gmail (OAuth2)
      security:
        - bearerAuth: []
      description: |
        Échange le code d'autorisation OAuth2 contre un refresh token et configure le compte Gmail.
        Nécessite capability emails:write ou rôle admin.
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailAccountRequest'
      responses:
        201:
          description: Compte Gmail connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAccount'
        400:
          description: Code OAuth invalide ou expiré
        403:
          description: Non autorisé

  /{org}/emails/accounts/{account_id}:
    get:
      summary: Détails d'un compte Gmail
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails du compte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAccountDetail'
        404:
          description: Compte non trouvé

    delete:
      summary: Déconnecter un compte Gmail
      security:
        - bearerAuth: []
      description: Supprime le compte et révoque l'accès OAuth2
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Compte déconnecté
        403:
          description: Non autorisé

  /{org}/emails/sync:
    post:
      summary: Déclencher la synchronisation des emails
      security:
        - bearerAuth: []
      description: |
        Lance le polling synchrone Gmail jusqu'à la vectorisation complète.
        Traitement incrémental (depuis last_uid) ou historique par période.
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSyncRequest'
      responses:
        200:
          description: Synchronisation terminée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSyncResponse'
        202:
          description: Synchronisation en cours (si async dans le futur)
        400:
          description: Paramètres invalides
        403:
          description: Non autorisé
        409:
          description: Une synchronisation est déjà en cours pour ce compte

  /{org}/emails/sync-status:
    get:
      summary: Statut de la dernière synchronisation
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Statut de synchronisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSyncStatus'

  /{org}/emails:
    get:
      summary: Lister les emails synchronisés
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrer par entreprise (company)
        - name: thread_id
          in: query
          schema:
            type: string
          description: Filtrer par thread de conversation
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, vectorized, error]
        - name: sender
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
          description: Recherche textuelle (sujet + contenu)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Liste des emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: '#/components/schemas/Email'
                  total:
                    type: integer

  /{org}/emails/{email_id}:
    get:
      summary: Détails d'un email
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Détails de l'email avec pièces jointes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
        404:
          description: Email non trouvé

  /{org}/emails/{email_id}/attachments/{attachment_id}/download:
    get:
      summary: Télécharger une pièce jointe
      security:
        - bearerAuth: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Fichier téléchargé
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: Pièce jointe non trouvée

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----------------------------------------
    # AUTH SCHEMAS
    # ----------------------------------------
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        org_id:
          type: string
          format: uuid
        org_slug:
          type: string
        org_name:
          type: string
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time

    EmailCheckRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    EmailCheckResponse:
      type: object
      properties:
        authorized:
          type: boolean
        exists:
          type: boolean
        org_id:
          type: string
          format: uuid
        org_slug:
          type: string
        org_name:
          type: string
        role:
          type: string
        message:
          type: string

    SignupRequest:
      type: object
      required:
        - email
        - password
        - org_id
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        org_id:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    # ----------------------------------------
    # CLIENT SCHEMAS
    # ----------------------------------------
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        siret:
          type: string
          pattern: '^[0-9]{14}$'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        siret:
          type: string
          pattern: '^[0-9]{14}$'
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        siret:
          type: string
          pattern: '^[0-9]{14}$'
        notes:
          type: string


    # ----------------------------------------
    # SCHEMAS EXISTANTS (LEGACY)
    # ----------------------------------------
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        org_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    # ----------------------------------------
    # NOUVEAUX SCHEMAS (AUTRES)
    # ----------------------------------------

    # Telegram
    TelegramBot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bot_username:
          type: string
        bot_id:
          type: integer
        company_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        is_configured:
          type: boolean
        description:
          type: string
        welcome_message:
          type: string
        created_at:
          type: string
          format: date-time

    CreateBotRequest:
      type: object
      required:
        - bot_token
        - webhook_base_url
      properties:
        bot_token:
          type: string
          description: Token du bot (depuis @BotFather)
        company_id:
          type: string
          format: uuid
          description: Entreprise associée (optionnel)
        webhook_base_url:
          type: string
          description: URL de base pour les webhooks
        description:
          type: string

    TelegramBotStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bot_username:
          type: string
        is_active:
          type: boolean
        is_configured:
          type: boolean
        created_at:
          type: string
          format: date-time
        stats_24h:
          type: object
          properties:
            interactions:
              type: integer
            errors:
              type: integer

    TelegramAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        telegram_user_id:
          type: integer
        interaction_type:
          type: string
          enum: [message_received, command_received, button_clicked, file_received, workflow_started, workflow_step, workflow_completed, workflow_failed, notification_sent, error]
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        workflow_name:
          type: string
        workflow_step:
          type: string
        error_message:
          type: string
        created_at:
          type: string
          format: date-time

    # Companies
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: "construction"
        name:
          type: string
          example: "Construction"
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # Invoices
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoice_number:
          type: string
          nullable: true
        supplier_name:
          type: string
        amount_ttc:
          type: number
          format: decimal
        invoice_date:
          type: string
          format: date
        status:
          type: string
          enum: [brouillon, en_attente_validation, validee, rejetee, en_traitement_comptable, archivee]
        created_at:
          type: string
          format: date-time
        created_by_telegram:
          type: boolean

    InvoiceDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          properties:
            supplier_address:
              type: string
            supplier_siret:
              type: string
            amount_ht:
              type: number
              format: decimal
            vat_amount:
              type: number
              format: decimal
            vat_rate:
              type: number
            due_date:
              type: string
              format: date
            description:
              type: string
            items:
              type: array
              items:
                type: object
            original_file_url:
              type: string
            thumbnail_url:
              type: string
            validated_by:
              type: string
              format: uuid
            validated_at:
              type: string
              format: date-time
            rejection_reason:
              type: string
            ocr_data:
              type: object

    CreateInvoiceRequest:
      type: object
      required:
        - supplier_name
        - amount_ttc
      properties:
        supplier_name:
          type: string
        supplier_address:
          type: string
        supplier_siret:
          type: string
        amount_ht:
          type: number
          format: decimal
        amount_ttc:
          type: number
          format: decimal
        vat_amount:
          type: number
          format: decimal
        vat_rate:
          type: number
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        description:
          type: string
        invoice_number:
          type: string
        original_file_url:
          type: string
        status:
          type: string
          enum: [brouillon, en_attente_validation]
          default: brouillon

    UpdateInvoiceRequest:
      type: object
      properties:
        supplier_name:
          type: string
        supplier_address:
          type: string
        supplier_siret:
          type: string
        amount_ht:
          type: number
          format: decimal
        amount_ttc:
          type: number
          format: decimal
        vat_amount:
          type: number
          format: decimal
        vat_rate:
          type: number
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        description:
          type: string
        invoice_number:
          type: string

    ValidateInvoiceRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [validate, reject]
        reason:
          type: string
          description: Raison du rejet (si action=reject)

    InvoiceStatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previous_status:
          type: string
        new_status:
          type: string
        changed_by:
          type: string
          format: uuid
        changed_by_telegram:
          type: boolean
        change_reason:
          type: string
        created_at:
          type: string
          format: date-time

    # ----------------------------------------
    # ADMIN SCHEMAS
    # ----------------------------------------

    PreAuthorizedEmail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
          default: user
        is_active:
          type: boolean
          default: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PreAuthorizedEmailCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
          default: user
        expires_at:
          type: string
          format: date-time
          nullable: true

    PreAuthorizedEmailUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true

    OrganizationCapability:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        capability_name:
          type: string
          example: "construction:facturation:read"
        description:
          type: string
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time

    OrganizationCapabilityCreate:
      type: object
      required:
        - capability_name
      properties:
        capability_name:
          type: string
          example: "construction:facturation:read"
        description:
          type: string
        is_active:
          type: boolean
          default: true

    UserCapability:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        capability_name:
          type: string
          example: "construction:facturation:read"
        resource_type:
          type: string
          enum: [company, global]
          default: global
        resource_id:
          type: string
          format: uuid
          nullable: true
        granted_by:
          type: string
          format: uuid
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCapabilityCreate:
      type: object
      required:
        - capability_name
      properties:
        capability_name:
          type: string
          example: "construction:facturation:read"
        resource_type:
          type: string
          enum: [company, global]
          default: global
        resource_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    UserCapabilityUpdate:
      type: object
      properties:
        resource_type:
          type: string
          enum: [company, global]
        resource_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true

    # Telegram Bot Schemas
    TelegramBotInfo:
      type: object
      properties:
        bot_id:
          type: string
          description: Identifiant unique du bot (e.g., 'construction', 'audit')
          example: "construction"
        bot_name:
          type: string
          description: Nom affiché du bot
          example: "Construction"
        description:
          type: string
          description: Description des fonctionnalités
          example: "Envoi et traitement des factures de construction"
        icon:
          type: string
          description: Emoji pour l'interface
          example: "🏗️"
        username:
          type: string
          description: Username Telegram du bot
          example: "suren_construction_bot"
        configured:
          type: boolean
          description: Indique si le bot est configuré

    TelegramInvitationRequest:
      type: object
      required:
        - bot_id
      properties:
        bot_id:
          type: string
          description: ID du bot vers lequel inviter l'utilisateur
          example: "construction"
        expires_in_hours:
          type: integer
          description: Durée de validité du lien en heures
          default: 168
          minimum: 1
          maximum: 720

    TelegramInvitationResponse:
      type: object
      properties:
        telegram_link:
          type: string
          description: Lien d'invitation complet
          example: "https://t.me/suren_construction_bot?start=ABC123..."
        bot_id:
          type: string
          description: ID du bot
          example: "construction"
        bot_name:
          type: string
          description: Nom du bot
          example: "Construction"
        bot_username:
          type: string
          description: Username Telegram
          example: "suren_construction_bot"
        bot_icon:
          type: string
          description: Emoji du bot
          example: "🏗️"
        description:
          type: string
          description: Description du bot
          example: "Envoi et traitement des factures de construction"
        expires_at:
          type: string
          format: date-time
          description: Date d'expiration du lien
        user_id:
          type: string
          format: uuid
          description: ID de l'utilisateur invité
        org_id:
          type: string
          format: uuid
          description: ID de l'organisation

    # ----------------------------------------
    # EMAIL SCHEMAS
    # ----------------------------------------

    EmailAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email_address:
          type: string
          format: email
        email_address_display:
          type: string
        is_active:
          type: boolean
        sync_enabled:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    EmailAccountDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/EmailAccount'
        - type: object
          properties:
            last_sync_uid:
              type: integer
              description: Dernier UID Gmail synchronisé
            total_emails_synced:
              type: integer
              description: Nombre total d'emails synchronisés
            pending_vectorization:
              type: integer
              description: Emails en attente de vectorisation
            recent_errors:
              type: array
              items:
                type: object
                properties:
                  error:
                    type: string
                  occurred_at:
                    type: string
                    format: date-time

    CreateEmailAccountRequest:
      type: object
      required:
        - email
        - oauth_code
        - redirect_uri
      properties:
        email:
          type: string
          format: email
          description: Adresse Gmail à connecter
        oauth_code:
          type: string
          description: Code d'autorisation OAuth2 (obtenu du flux Google)
        redirect_uri:
          type: string
          description: URI de redirection configurée dans Google Cloud Console
        email_address_display:
          type: string
          description: Nom d'affichage personnalisé (optionnel)

    EmailSyncRequest:
      type: object
      required:
        - account_id
      properties:
        account_id:
          type: string
          format: uuid
          description: ID du compte Gmail à synchroniser
        sync_mode:
          type: string
          enum: [incremental, historical]
          default: incremental
          description: |
            Mode de synchronisation :
            - incremental : depuis le dernier UID (défaut)
            - historical : par période pour import d'existant
        date_range:
          type: object
          description: Requis si sync_mode=historical
          properties:
            start_date:
              type: string
              format: date
              description: Date de début (YYYY-MM-DD)
            end_date:
              type: string
              format: date
              description: Date de fin (YYYY-MM-DD)
        max_emails:
          type: integer
          default: 1000
          description: Nombre maximum d'emails à traiter (limite de sécurité)

    EmailSyncResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        synced:
          type: integer
          description: Nombre d'emails synchronisés (routing OK)
        ignored:
          type: integer
          description: Nombre d'emails ignorés (alias invalide)
        ignored_breakdown:
          type: object
          description: Détail des emails ignorés
          properties:
            no_alias:
              type: integer
              description: Emails sans alias (REDACTED_EMAIL)
            org_mismatch:
              type: integer
              description: Emails pour autre environnement
            company_not_found:
              type: integer
              description: Company slug inexistant
        vectorized:
          type: integer
          description: Nombre d'emails vectorisés
        errors:
          type: integer
          description: Nombre d'erreurs
        last_uid:
          type: integer
          description: Dernier UID traité
        duration_seconds:
          type: integer
          description: Durée totale du traitement
        completed_at:
          type: string
          format: date-time

    EmailSyncStatus:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [idle, syncing, error]
        last_sync:
          type: string
          format: date-time
          nullable: true
        last_sync_uid:
          type: integer
        stats:
          type: object
          properties:
            total_synced:
              type: integer
              description: Total emails avec routing OK
            total_ignored:
              type: integer
              description: Total emails ignorés (alias invalide)
            pending:
              type: integer
              description: Emails en attente de vectorisation
            processing:
              type: integer
              description: Emails en cours de traitement
            vectorized:
              type: integer
              description: Emails prêts pour Secrétariat
            error:
              type: integer
              description: Emails en erreur

    Email:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          description: Company déduite de l'alias Gmail
        company_slug:
          type: string
          description: Slug de la company (pour affichage)
        company_name:
          type: string
          description: Nom de la company (pour affichage)
        delivered_to_alias:
          type: string
          description: Alias complet (REDACTED_EMAIL)
          example: "REDACTED_EMAIL"
        gmail_thread_id:
          type: string
          description: ID du thread Gmail (conversation)
        gmail_message_id:
          type: string
          description: ID unique du message Gmail
        subject:
          type: string
        subject_cleaned:
          type: string
        sender_email:
          type: string
          format: email
          description: Email du client expéditeur (pas le compte Gmail)
        sender_name:
          type: string
        recipient_emails:
          type: array
          items:
            type: string
            format: email
          description: Liste des destinataires (incluant l'alias Gmail)
        sent_at:
          type: string
          format: date-time
        processing_status:
          type: string
          enum: [pending, processing, vectorized, error]
        has_attachments:
          type: boolean
        attachments_count:
          type: integer
        snippet:
          type: string
          description: Extrait du contenu (150 premiers caractères)

    EmailDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/Email'
        - type: object
          properties:
            content_text:
              type: string
              description: Contenu nettoyé par RAG Mail
            content_text_raw:
              type: string
              description: Contenu original brut
            headers:
              type: object
              description: Headers complets de l'email
            in_reply_to:
              type: string
              description: Message-ID auquel cet email répond
            references:
              type: array
              items:
                type: string
              description: Chaîne de références Message-ID
            gmail_labels:
              type: array
              items:
                type: string
            processing_error:
              type: string
              nullable: true
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/EmailAttachment'
            embeddings_status:
              type: object
              properties:
                total_chunks:
                  type: integer
                body_vectorized:
                  type: boolean
                attachments_vectorized:
                  type: integer
            thread_emails:
              type: array
              items:
                $ref: '#/components/schemas/Email'
              description: Autres emails du même thread

    EmailAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        filename_clean:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        file_extension:
          type: string
        is_processed:
          type: boolean
          description: OCR/analyse effectuée
        ocr_text:
          type: string
          description: Texte extrait si applicable
          nullable: true
        ocr_confidence:
          type: number
          format: decimal
          minimum: 0
          maximum: 1
          nullable: true
        is_inline:
          type: boolean
          description: Image inline dans HTML
