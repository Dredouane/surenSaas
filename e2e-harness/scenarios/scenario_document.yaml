test_case: "DOCUMENT-001"
description: "L'utilisateur demande à envoyer une facture. Le bot doit comprendre l'intention et demander le fichier."
steps:
  - type: text
    content: "Je voudrais envoyer une facture pour le chantier CH-016"
    judge_prompt: |
      Vérifie que la réponse du bot :
      1. Accuse réception de l'intention d'envoyer une facture
      2. Demande à l'utilisateur d'envoyer le fichier (PDF, photo)
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
