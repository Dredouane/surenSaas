test_case: "DEPENSE-001"
description: "L'utilisateur envoie un message texte pour enregistrer une dépense de 150€ pour du béton sur le chantier CH-016. Le bot doit extraire le montant, le chantier et la date du jour, puis confirmer la création."
steps:
  - type: text
    content: "Aujourd'hui, j'ai dépensé 150€ pour le béton sur CH-016"
    judge_prompt: |
      Vérifie la capture de l'intention :
      1. Le bot a-t-il identifié la nature de la demande (Dépense) ?
      2. Le montant (150€) et le chantier (CH-016) sont-ils cités (Résonance) ?
      3. Le bot propose-t-il de valider ou demande-t-il une confirmation avant l'enregistrement ?
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
