test_case: "POINTAGE-001"
description: "L'utilisateur pointe la présence d'un homme (Jean Dupont) et d'une machine (pelleteuse) sur le chantier CH-016. Le bot doit reconnaître les deux types de ressources et confirmer le pointage."
steps:
  - type: text
    content: "Je pointe Jean Dupont et la pelleteuse sur CH-016"
    judge_prompt: |
      Vérifie la capture exhaustive de l'intention :
      1. Le bot a-t-il détecté les DEUX ressources (Jean Dupont ET pelleteuse) ?
      2. Le chantier CH-016 est-il identifié ou cité dans la réponse ?
      3. Le bot propose-t-il une suite logique (confirmation, menu de sélection, ou demande de validation) ?
      Score 0 si l'une des deux ressources (humaine ou machine) est totalement oubliée.
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
