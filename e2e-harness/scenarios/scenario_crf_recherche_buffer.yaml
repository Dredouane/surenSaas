test_case: "SESSION-001-CRF-BUFFER"
description: "Dépense 150€ carburant Point P sur chantier CRF. Le bot doit trouver CRF via search_chantiers, proposer menu, puis restaurer buffer_data après clic callback."
steps:
  - type: text
    mode: sync
    content: "J'ai acheté pour 150€ de carburant chez Point P pour le chantier CRF"
    judge_prompt: |
      Vérifie que l'assistant :
      1. Identifie le chantier CRF (ou son nom complet en DB : chantier-crf-001).
      2. Extrait le montant 150€.
      3. Extrait le fournisseur Point P.
      4. Propose un choix (DISPLAY_MENU) avec les chantiers trouvés.
      Ne pas accepter "je cherche" — exige un résultat concret.
    expected_verdict: pass

  - type: callback
    mode: async
    content: "chantier-crf-001"
    judge_prompt: |
      Vérifie l'exactitude après sélection :
      1. Le bot confirme-t-il que le chantier choisi est bien rattaché à la dépense ?
      2. Les informations initiales (150€, Point P) sont-elles toujours présentes dans la proposition de validation ?
      3. L'interface propose-t-elle un bouton de confirmation finale ?
    expected_verdict: pass
