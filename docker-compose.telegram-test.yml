# ================================================================
# docker-compose.telegram-test.yml
# tg-mock — mock Telegram Bot API server pour les tests E2E
# Documentation : https://github.com/watzon/tg-mock
# ================================================================
# Démarrage :
#   docker compose -f docker-compose.telegram-test.yml up -d
# Arrêt :
#   docker compose -f docker-compose.telegram-test.yml down
# Logs :
#   docker compose -f docker-compose.telegram-test.yml logs -f
# ================================================================

services:
  tg-mock:
    image: ghcr.io/watzon/tg-mock:latest
    container_name: tg-mock
    ports:
      - "8081:8081"
    environment:
      - TG_MOCK_PORT=8081
    command: ["-port", "8081", "-verbose"]
    # Note: Pas de healthcheck Docker car l'image tg-mock est un binaire Go statique
    # sans curl/sh. La santé est vérifiable via curl externe sur /health.
    restart: unless-stopped
