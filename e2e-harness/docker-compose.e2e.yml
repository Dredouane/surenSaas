# ================================================================
# telegram-bot-api (serveur local Telegram)
# Utilisation : docker compose -f docker-compose.e2e.yml up -d
#
# Ce service est OPTIONNEL. Par défaut, les tests utilisent
# l'API officielle https://api.telegram.org.
#
 # Pour l'utiliser, il faut configurer TELEGRAM_API_ID et
# TELEGRAM_API_HASH avec de vraies valeurs Telegram (depuis
# https://my.telegram.org/apps).
#
# Les valeurs "6"/"014b35..." ci-dessous sont des valeurs par
# défaut qui ne fonctionnent PAS. Remplace-les par les tiennes.
# ================================================================

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    ports:
      - "8081:8081"
    environment:
      - TELEGRAM_TOKEN=${SUREN_TEST_TELEGRAM_CONSTRUCTION_E2E_BOT_TOKEN}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-6}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-014b35b6184100b085b0d0572f9b5103}
    entrypoint: ["telegram-bot-api"]
    command: ["--local", "--dir=/var/lib/telegram-bot-api", "--temp-dir=/tmp/telegram-bot-api", "--http-port=8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/bot${SUREN_TEST_TELEGRAM_CONSTRUCTION_E2E_BOT_TOKEN}/getMe || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
