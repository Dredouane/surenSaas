test_case: "DOCUMENT-OCR-001"
description: "L'utilisateur envoie une facture PDF (ACORUS, INV-EXA-0001, 3280.78€ HT). Le bot doit extraire les données et proposer validation/modification."
steps:
  - type: document
    content: "e2e-harness/data/INV-EXA-0001_EXAMPLE-SOCIETE.pdf"
    judge_prompt: |
      Vérifie la qualité de l'extraction OCR :
      1. Fournisseur (Acorus) et Montant (~3280.78€) sont-ils extraits correctement ?
      2. Le bot cite-t-il un numéro de référence présent sur le document (Facture ou Commande) ? Ne pas pénaliser une inversion si l'ID est correct.
      3. Propose-t-il de valider ou modifier les données ?
      Réponds UNIQUEMENT en JSON : {"score": 1|0, "reason": "..."}
    expected_verdict: pass
